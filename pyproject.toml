[project]
name = "outgrow"
version = "0.0.0"
description = "Daily-pulse engine that prompts reps to reach out to dormant customers."
requires-python = ">=3.11,<4.0"
readme = "README.md"
dependencies = [
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "click>=8.1",
    "anthropic>=0.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyright>=1.1.350",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["intake*", "voice*", "drafting*", "sync*", "ranking*", "pulse*", "matching*", "pipeline*"]
exclude = ["tests*", "scripts*", "docs*", "config*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "error"
include = ["intake", "voice", "drafting", "sync", "ranking", "pulse", "matching", "pipeline", "scripts", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
