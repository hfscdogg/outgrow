# Ranking-engine knobs that don't fit in `plays.yaml`. The score formula is
# documented in docs/plan.md and implemented in `ranking/engine.py`:
#
#   final_score = play.base_weight
#               * play.seasonal_weights[current_month]
#               * log10(LTV_cents + legacy_bonus_cents)
#               * dormancy_factor(dormancy_days)
#               * rep_match_confidence
#               - suppression_penalty

schema_version: 1

# Customers whose first known contact predates the QBO migration get a bonus
# added to LTV (in cents) before log10. Their QBO-visible spend is a floor,
# not their true lifetime spend, so this keeps high-value pre-QBO dormants
# from being out-ranked by modest modern customers. Tune both knobs from
# real action/reply data once the pilot has 30 days of signal.
legacy_bonus:
  qbo_horizon_iso: "2017-01-01"             # update if QBO instance was migrated
  bonus_cents_per_year_before_horizon: 5000000   # $50k/year of pre-QBO age

# Sweet-spot curve in days since last_purchase_at. Too recent feels intrusive;
# too old erodes recognition + data quality. Piecewise:
#   < too_recent_days                        -> 0   (suppress)
#   too_recent_days .. ramp_up_days          -> linear 0 -> 1.0
#   ramp_up_days   .. sweet_spot_end_days    -> hold at 1.0
#   sweet_spot_end .. decay_floor_days       -> linear 1.0 -> cold_floor_factor
#   >= decay_floor_days                      -> hold at cold_floor_factor
dormancy:
  too_recent_days: 30
  ramp_up_days: 180
  sweet_spot_end_days: 720
  decay_floor_days: 1825
  cold_floor_factor: 0.5

# rep_match_confidence acts as a multiplier (0.0-1.0) on the final score.
# Below `min_confidence` the customer is filtered out entirely (the
# three-way Zoho/QBO/D-Tools disagreement case in docs/plan.md). Medium-
# confidence customers still surface; the pulse exposes a "Not my customer
# - reassign" link for the rep to one-tap.
rep_match:
  min_confidence: 0.5

# Hard floor on raw QBO-visible lifetime spend (cents). One-off small-job
# customers (single service call, one-time accessory sale) drop out before
# scoring — the rep doesn't have enough context on them for a proactive
# pulse to feel personal. Compared against raw LTV only; the `legacy_bonus`
# above is excluded so a pre-QBO customer with $200 of visible spend gets
# filtered the same as a modern one. If pre-QBO customers should pass,
# either backfill their LTV or lower this floor.
eligibility:
  min_lifetime_spend_cents: 200000  # $2,000

# Reserved for future soft-suppression (recently-sent etc.). Hard suppressions
# (open_ticket, active_deal, opted_out) filter the customer out upstream and
# never reach the score formula.
suppression_penalty: 0.0

# Anthropic models for `drafting/generator.py`. Default is Sonnet 4.6;
# fallback (one retry) on rate-limit (429) or 5xx is Haiku 4.5. Both pinned
# here per docs/plan.md so model upgrades are a config change, not a code
# change. `max_tokens` is tuned for short SMS-length drafts (≤ ~300 chars).
# (`temperature` was removed in anthropic SDK 1.x — current models don't
# accept sampling parameters.)
drafter:
  primary_model: "claude-sonnet-4-6"
  fallback_model: "claude-haiku-4-5-20251001"
  max_tokens: 400
