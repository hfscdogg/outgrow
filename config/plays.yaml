# Outgrow play definitions. Ranking pipeline:
#   final_score = play.base_weight
#               * play.seasonal_weights[current_month]
#               * log10(LTV + legacy_bonus)
#               * dormancy_factor
#               * rep_match_confidence
#               - suppression_penalty
#
# Seasonal weights default to 1.0 (neutral) for every month. Tune from real
# action and reply data once the pilot has 30 days of signal.
#
# `min/max_days_since_install` are null across all Phase 1 plays because the
# engine has no install-date source yet (D-Tools sync lands in Phase 2). The
# dormancy curve (config/ranking.yaml `too_recent_days`) already prevents
# pestering active customers. Re-enable per-play install gating after
# D-Tools data starts flowing into `Customer.last_install_completed_at`.

plays:
  - key: daily_proactive
    label: "Daily Proactive Outreach"
    enabled: true
    base_weight: 1.0
    min_days_since_install: null
    max_days_since_install: null
    seasonal_weights:
      jan: 1.0
      feb: 1.0
      mar: 1.0
      apr: 1.0
      may: 1.0
      jun: 1.0
      jul: 1.0
      aug: 1.0
      sep: 1.0
      oct: 1.0
      nov: 1.0
      dec: 1.0

  - key: reverse_dyk
    label: "Reverse Did-You-Know"
    enabled: true
    base_weight: 0.8
    min_days_since_install: null
    max_days_since_install: null
    seasonal_weights:
      jan: 1.0
      feb: 1.0
      mar: 1.0
      apr: 1.0
      may: 1.0
      jun: 1.0
      jul: 1.0
      aug: 1.0
      sep: 1.0
      oct: 1.0
      nov: 1.0
      dec: 1.0

  - key: referral
    label: "Referral Ask"
    enabled: true
    base_weight: 0.6
    min_days_since_install: null
    max_days_since_install: null
    seasonal_weights:
      jan: 1.0
      feb: 1.0
      mar: 1.0
      apr: 1.0
      may: 1.0
      jun: 1.0
      jul: 1.0
      aug: 1.0
      sep: 1.0
      oct: 1.0
      nov: 1.0
      dec: 1.0
