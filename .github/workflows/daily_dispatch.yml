name: daily-dispatch

# Sends one Outgrow pulse per rep at 07:00 ET on weekdays. The cron line
# below uses 11:00 UTC, which is 07:00 EDT (UTC-4) — correct for the
# May-Oct pilot window. Revisit at the next DST flip: in EST (UTC-5),
# 07:00 ET is 12:00 UTC, so flip the hour to "0 12 * * 1-5" each November.
# `vars.OUTGROW_PAUSED=true` keeps the job from running even when triggered
# manually; flip it to `false` only after a green dry-run review.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1-5"  # 07:00 ET during DST; bump to "0 12" in November

jobs:
  dispatch:
    if: ${{ vars.OUTGROW_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Sync — Zoho CRM (read-only)
        env:
          ZOHO_CRM_REFRESH_TOKEN: ${{ secrets.ZOHO_CRM_REFRESH_TOKEN }}
          ZOHO_CRM_CLIENT_ID: ${{ secrets.ZOHO_CRM_CLIENT_ID }}
          ZOHO_CRM_CLIENT_SECRET: ${{ secrets.ZOHO_CRM_CLIENT_SECRET }}
          ZOHO_CRM_DC: ${{ vars.ZOHO_CRM_DC }}
        run: uv run python -m sync.zoho_crm

      - name: Sync — QBO sandbox (read-only)
        env:
          QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          QBO_SANDBOX_REFRESH_TOKEN: ${{ secrets.QBO_SANDBOX_REFRESH_TOKEN }}
          QBO_SANDBOX_REALM_ID: ${{ secrets.QBO_SANDBOX_REALM_ID }}
        run: uv run python -m sync.qbo

      - name: Rank → Draft → Mail (orchestrator, dry-run by default)
        env:
          OUTGROW_HMAC_SECRET: ${{ secrets.OUTGROW_HMAC_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OUTGROW_PAUSED: ${{ vars.OUTGROW_PAUSED }}
          OUTGROW_OWNER_EMAIL: ${{ vars.OUTGROW_OWNER_EMAIL }}
          OUTGROW_CONTROL_ADDRESS: ${{ vars.OUTGROW_CONTROL_ADDRESS }}
          OUTGROW_SENDER_EMAIL: ${{ vars.OUTGROW_SENDER_EMAIL }}
        run: uv run python -m scripts.daily_pulse --dry-run
