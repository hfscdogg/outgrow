name: daily-dispatch

# Sends one Outgrow pulse per rep at ~07:13 ET on weekdays.
#
# PRIMARY TRIGGER: repository_dispatch (event_type "daily-pulse"), fired
# by an external scheduler (cron-job.org) hitting the GitHub dispatch
# API. GitHub's own `schedule` event proved unreliable — every trigger
# was silently dropped May 19 + May 20 2026, including a three-cron
# spread. repository_dispatch is an explicit API call GitHub processes
# immediately, so it doesn't get dropped. Setup: docs/phase1/external_scheduler.md
#
# FALLBACK TRIGGERS: the `schedule` block below is kept as a no-cost
# tertiary safety net (it occasionally works) and `workflow_dispatch`
# is the manual backstop. Same-day idempotency in the orchestrator (see
# pipeline/suppressions.py::reps_pulsed_today) means a fallback firing
# after the primary already sent no-ops cleanly.
#
# Schedule triggers in UTC; ET column is during DST (UTC-4). At the
# November DST flip change "11"/"12" to "12"/"13".
#
#   11:13 UTC = 07:13 ET (primary)
#   11:43 UTC = 07:43 ET (30-min backup)
#   12:13 UTC = 08:13 ET (last-chance)
#
# `vars.OUTGROW_PAUSED=true` keeps every trigger from running.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [daily-pulse]
  schedule:
    - cron: "13 11 * * 1-5"
    - cron: "43 11 * * 1-5"
    - cron: "13 12 * * 1-5"

# Serialize ALL workflows that commit state/pulse_history.json back to main
# (daily-dispatch + inbox-poll) under one shared concurrency group. They both
# git-push the same file; in separate groups they could run simultaneously and
# the second push would fail non-fast-forward (this took down the Jun 29 run:
# an hourly inbox-poll pushed mid-dispatch). A single group queues them so each
# run checks out a main that already contains the previous writer's commit.
# ``cancel-in-progress: false`` so we queue rather than killing an in-flight
# pulse mid-send.
concurrency:
  group: outgrow-state-write
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ vars.OUTGROW_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    # ``contents: write`` so the final step can git-push the updated
    # state/pulse_history.json back to main. Default GITHUB_TOKEN is
    # used; no PAT needed.
    permissions:
      contents: write
    # Sized for production data: Zoho sync ~2m, QBO sync ~9m, orchestrator
    # ~5m (Tier 3 fuzzy match + 2 Anthropic calls). 45m ceiling leaves
    # headroom for growth; revisit if real runs trend above 30m.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Sync — Zoho CRM (read-only)
        env:
          ZOHO_CRM_REFRESH_TOKEN: ${{ secrets.ZOHO_CRM_REFRESH_TOKEN }}
          ZOHO_CRM_CLIENT_ID: ${{ secrets.ZOHO_CRM_CLIENT_ID }}
          ZOHO_CRM_CLIENT_SECRET: ${{ secrets.ZOHO_CRM_CLIENT_SECRET }}
          ZOHO_CRM_DC: ${{ vars.ZOHO_CRM_DC }}
        run: uv run python -m sync.zoho_crm

      - name: Sync — QBO (read-only, sandbox or prod)
        env:
          # Sandbox creds (default path)
          QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          QBO_SANDBOX_REFRESH_TOKEN: ${{ secrets.QBO_SANDBOX_REFRESH_TOKEN }}
          QBO_SANDBOX_REALM_ID: ${{ secrets.QBO_SANDBOX_REALM_ID }}
          # Production creds (used when OUTGROW_USE_QBO_PROD=true).
          # Intuit issues separate client_id / client_secret per env.
          QBO_PROD_CLIENT_ID: ${{ secrets.QBO_PROD_CLIENT_ID }}
          QBO_PROD_CLIENT_SECRET: ${{ secrets.QBO_PROD_CLIENT_SECRET }}
          QBO_PROD_REFRESH_TOKEN: ${{ secrets.QBO_PROD_REFRESH_TOKEN }}
          QBO_PROD_REALM_ID: ${{ secrets.QBO_PROD_REALM_ID }}
          # Toggle (repo variable, not secret). Set to "true" to point at
          # production QBO; absent/false keeps the sandbox path.
          OUTGROW_USE_QBO_PROD: ${{ vars.OUTGROW_USE_QBO_PROD }}
          # PAT scoped to actions:write on this repo only — used to
          # write back the rotated QBO refresh token. Without it, the
          # sync still works for ~24h then breaks with invalid_grant.
          GH_PAT_ROTATE_SECRETS: ${{ secrets.GH_PAT_ROTATE_SECRETS }}
        run: uv run python -m sync.qbo

      - name: Rank → Draft → Mail (orchestrator)
        env:
          OUTGROW_HMAC_SECRET: ${{ secrets.OUTGROW_HMAC_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OUTGROW_PAUSED: ${{ vars.OUTGROW_PAUSED }}
          OUTGROW_OWNER_EMAIL: ${{ vars.OUTGROW_OWNER_EMAIL }}
          OUTGROW_CONTROL_ADDRESS: ${{ vars.OUTGROW_CONTROL_ADDRESS }}
          OUTGROW_SENDER_EMAIL: ${{ vars.OUTGROW_SENDER_EMAIL }}
          # SMTP creds — only consumed when OUTGROW_WRITE_MODE=true selects --write.
          # Google Workspace defaults: smtp.gmail.com:587 with STARTTLS. Override
          # OUTGROW_SMTP_HOST/_PORT for a different provider. OUTGROW_SMTP_USER
          # is the sending mailbox (typically outgrow-control@getlivewire.com);
          # OUTGROW_SMTP_PASS is a Google App Password (16-char, no spaces).
          OUTGROW_SMTP_HOST: ${{ vars.OUTGROW_SMTP_HOST }}
          OUTGROW_SMTP_PORT: ${{ vars.OUTGROW_SMTP_PORT }}
          OUTGROW_SMTP_USER: ${{ secrets.OUTGROW_SMTP_USER }}
          OUTGROW_SMTP_PASS: ${{ secrets.OUTGROW_SMTP_PASS }}
        # `vars.OUTGROW_WRITE_MODE=true` swaps --dry-run for --write. Keep it
        # absent (or "false") until you've manually dispatched once with --write
        # and confirmed the test email lands in the rep inbox. The recipient
        # allowlist + OUTGROW_PAUSED gate are the safety belts; this toggle is
        # the explicit ignition.
        run: |
          if [ "${{ vars.OUTGROW_WRITE_MODE }}" = "true" ]; then
            uv run python -m scripts.daily_pulse --write
          else
            uv run python -m scripts.daily_pulse --dry-run
          fi

      # Persists the orchestrator's pulse-history update back to main so the
      # next run knows which customers it already pulsed (within the 90-day
      # suppression window). Runs even on partial failure (one rep failing
      # shouldn't lose the other rep's history entry).
      - name: Commit updated pulse history
        if: always()
        run: |
          if [ -z "$(git status --porcelain state/pulse_history.json)" ]; then
            echo "no pulse history changes; skipping commit"
            exit 0
          fi
          git config user.name "outgrow-bot"
          git config user.email "outgrow-bot@users.noreply.github.com"
          git add state/pulse_history.json
          git commit -m "chore(pulse): record sent customers $(date -u +%Y-%m-%d)"
          # The shared concurrency group should keep state writers serialized,
          # but rebase-and-retry as defense in depth: if main moved under us
          # (e.g. a branch-protection-exempt push), replay our commit on top
          # rather than failing the whole dispatch on a non-fast-forward.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed pulse history on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto latest main"
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort 2>/dev/null || true
              echo "::warning::rebase hit a conflict on pulse_history.json; retrying"
            fi
          done
          echo "::error::failed to push pulse history after 5 attempts"
          exit 1
