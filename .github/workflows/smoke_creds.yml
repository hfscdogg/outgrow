name: smoke-creds

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: ${{ vars.OUTGROW_PAUSED != 'true' }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ZOHO_CRM_REFRESH_TOKEN: ${{ secrets.ZOHO_CRM_REFRESH_TOKEN }}
      ZOHO_CRM_CLIENT_ID: ${{ secrets.ZOHO_CRM_CLIENT_ID }}
      ZOHO_CRM_CLIENT_SECRET: ${{ secrets.ZOHO_CRM_CLIENT_SECRET }}
      ZOHO_CRM_DC: ${{ secrets.ZOHO_CRM_DC }}
      QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
      QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
      QBO_SANDBOX_REFRESH_TOKEN: ${{ secrets.QBO_SANDBOX_REFRESH_TOKEN }}
      QBO_SANDBOX_REALM_ID: ${{ secrets.QBO_SANDBOX_REALM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv venv && source .venv/bin/activate && uv pip install -e ".[dev]"
      - name: Run credential smoke test
        run: source .venv/bin/activate && python scripts/smoke_creds.py
