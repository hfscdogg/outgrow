name: inbox-poll

# Polls Gmail's `+outgrow` label for action replies (SENT / EDITED /
# SKIPPED / REASSIGN), verifies their HMAC tokens, and updates
# state/pulse_history.json with what each rep did.
#
# PRIMARY TRIGGER: repository_dispatch (event_type "inbox-poll") fired
# by cron-job.org hourly during business hours. See
# docs/phase2/gmail_oauth_setup.md for setup.
#
# Idempotent by design — each processed Gmail message gets the
# "OutgrowProcessed" label and is skipped on subsequent polls. No
# state corruption if multiple polls fire close together; the same
# action is applied twice with the same result.
#
# `vars.OUTGROW_PAUSED=true` keeps this from running.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [inbox-poll]

# Shared concurrency group with daily-dispatch: both commit
# state/pulse_history.json back to main, so they must not run at the same
# time or the second push fails non-fast-forward (the Jun 29 dispatch
# failure). One group serializes every state writer repo-wide. Serializing
# only orders the writes; each run must also check out `main` to read what
# the run ahead of it wrote.
# cancel-in-progress: false because we'd rather queue than kill a poll that
# already fetched messages.
concurrency:
  group: outgrow-state-write
  cancel-in-progress: false

jobs:
  poll:
    if: ${{ vars.OUTGROW_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for the final pulse_history.json commit
    timeout-minutes: 10
    steps:
      # ``ref: main`` rather than the triggering SHA: this workflow shares a
      # concurrency group with daily-dispatch, so a queued poll would
      # otherwise start from a pulse_history.json that predates the commit
      # the run ahead of it just pushed — and then re-apply its own updates
      # on top of a stale file, conflicting on push. ``fetch-depth: 0`` so
      # the commit step can reset onto a moved main without a shallow
      # boundary getting in the way.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Poll Gmail + apply actions
        env:
          OUTGROW_HMAC_SECRET: ${{ secrets.OUTGROW_HMAC_SECRET }}
          OUTGROW_PAUSED: ${{ vars.OUTGROW_PAUSED }}
          OUTGROW_GMAIL_CLIENT_ID: ${{ secrets.OUTGROW_GMAIL_CLIENT_ID }}
          OUTGROW_GMAIL_CLIENT_SECRET: ${{ secrets.OUTGROW_GMAIL_CLIENT_SECRET }}
          OUTGROW_GMAIL_REFRESH_TOKEN: ${{ secrets.OUTGROW_GMAIL_REFRESH_TOKEN }}
          OUTGROW_GMAIL_USER: ${{ secrets.OUTGROW_GMAIL_USER }}
          OUTGROW_INBOX_LABEL: ${{ vars.OUTGROW_INBOX_LABEL }}
          # Needed by the BCC auto-log pass to reconstruct each pulse's
          # compose-button BCC address. Absent -> pass is skipped.
          OUTGROW_CONTROL_ADDRESS: ${{ vars.OUTGROW_CONTROL_ADDRESS }}
        run: uv run python -m scripts.inbox_poll

      - name: Commit updated pulse history
        if: always()
        run: |
          if [ -z "$(git status --porcelain state/pulse_history.json)" ]; then
            echo "no action updates; skipping commit"
            exit 0
          fi
          git config user.name "outgrow-bot"
          git config user.email "outgrow-bot@users.noreply.github.com"
          git add state/pulse_history.json
          git commit -m "chore(inbox): record rep actions $(date -u +%Y-%m-%dT%H:%MZ)"
          # Shared concurrency group keeps state writers serialized; retry as
          # defense in depth if main moved anyway. Rebase can't resolve this
          # on its own — two writers editing the same JSON array conflict
          # textually and every retry replays the same conflict — so reset
          # onto the new main and rebuild the file as a key-aware union of
          # both sides instead. Same routine as daily-dispatch's commit step;
          # see scripts/merge_pulse_history.py for the merge rules.
          cp scripts/merge_pulse_history.py "$RUNNER_TEMP/merge_pulse_history.py"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed rep actions on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt); merging onto latest main"
            cp state/pulse_history.json "$RUNNER_TEMP/ours.json"
            git fetch origin main
            git reset --hard FETCH_HEAD
            python3 "$RUNNER_TEMP/merge_pulse_history.py" \
              --ours "$RUNNER_TEMP/ours.json" \
              --theirs state/pulse_history.json \
              --out state/pulse_history.json
            if git diff --quiet -- state/pulse_history.json; then
              echo "main already contains our updates; nothing left to push"
              exit 0
            fi
            git add state/pulse_history.json
            git commit -m "chore(inbox): record rep actions $(date -u +%Y-%m-%dT%H:%MZ)"
          done
          echo "::error::failed to push rep actions after 5 attempts"
          exit 1
