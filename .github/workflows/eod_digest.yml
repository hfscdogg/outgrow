name: eod-digest

# Emails the owner an end-of-day digest at 17:00 ET: per-rep counts of
# pulses sent, edited, skipped, ignored. Cron is commented out until Phase 2.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 21 * * 1-5"  # 17:00 ET (UTC-4 during DST); revisit twice a year for DST drift

jobs:
  digest:
    if: ${{ vars.OUTGROW_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Send EOD digest (Phase 2+)
        env:
          OUTGROW_SMTP_HOST: ${{ secrets.OUTGROW_SMTP_HOST }}
          OUTGROW_SMTP_USER: ${{ secrets.OUTGROW_SMTP_USER }}
          OUTGROW_SMTP_PASSWORD: ${{ secrets.OUTGROW_SMTP_PASSWORD }}
        run: |
          echo "Phase 0 scaffold: digest is a no-op until Phase 2 lands."
