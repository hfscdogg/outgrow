name: rep-attribution-report

# On-demand preview of contact-owner vs deal-owner rep attribution
# (scripts/rep_attribution_report.py). Syncs Zoho + QBO the same way
# daily-dispatch does, then prints per-rep pool sizes and how many
# customers would change rep — to the log and the run's summary page.
#
# Read-only: no drafting, no email, no state commit. Shares the
# daily-dispatch concurrency group so the two never run the QBO sync at
# the same time (it rotates the QBO refresh token and writes it back).

on:
  workflow_dispatch:

concurrency:
  group: outgrow-state-write
  cancel-in-progress: false

jobs:
  report:
    name: Rep attribution preview (read-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Sync — Zoho CRM (read-only)
        env:
          ZOHO_CRM_REFRESH_TOKEN: ${{ secrets.ZOHO_CRM_REFRESH_TOKEN }}
          ZOHO_CRM_CLIENT_ID: ${{ secrets.ZOHO_CRM_CLIENT_ID }}
          ZOHO_CRM_CLIENT_SECRET: ${{ secrets.ZOHO_CRM_CLIENT_SECRET }}
          ZOHO_CRM_DC: ${{ vars.ZOHO_CRM_DC }}
        run: uv run python -m sync.zoho_crm

      - name: Sync — QBO (read-only, sandbox or prod)
        env:
          QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          QBO_SANDBOX_REFRESH_TOKEN: ${{ secrets.QBO_SANDBOX_REFRESH_TOKEN }}
          QBO_SANDBOX_REALM_ID: ${{ secrets.QBO_SANDBOX_REALM_ID }}
          QBO_PROD_CLIENT_ID: ${{ secrets.QBO_PROD_CLIENT_ID }}
          QBO_PROD_CLIENT_SECRET: ${{ secrets.QBO_PROD_CLIENT_SECRET }}
          QBO_PROD_REFRESH_TOKEN: ${{ secrets.QBO_PROD_REFRESH_TOKEN }}
          QBO_PROD_REALM_ID: ${{ secrets.QBO_PROD_REALM_ID }}
          OUTGROW_USE_QBO_PROD: ${{ vars.OUTGROW_USE_QBO_PROD }}
          GH_PAT_ROTATE_SECRETS: ${{ secrets.GH_PAT_ROTATE_SECRETS }}
        run: uv run python -m sync.qbo

      - name: Attribution report
        run: uv run python -m scripts.rep_attribution_report
