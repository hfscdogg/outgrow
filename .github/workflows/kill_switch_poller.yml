name: kill-switch-poller

# Polls the control inbox for SENT / EDITED / SKIPPED / PAUSE / KILL emails
# from reps and the owner. 5-minute cadence keeps Zoho Call Activity in sync
# with rep actions. Cron is commented out until Phase 2.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/5 * * * *"

jobs:
  poll:
    if: ${{ vars.OUTGROW_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Poll control inbox (Phase 2+)
        env:
          OUTGROW_HMAC_SECRET: ${{ secrets.OUTGROW_HMAC_SECRET }}
          OUTGROW_IMAP_HOST: ${{ secrets.OUTGROW_IMAP_HOST }}
          OUTGROW_IMAP_USER: ${{ secrets.OUTGROW_IMAP_USER }}
          OUTGROW_IMAP_PASSWORD: ${{ secrets.OUTGROW_IMAP_PASSWORD }}
        run: |
          echo "Phase 0 scaffold: poller is a no-op until Phase 2 lands."
